<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catan Counter — v2 preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      /* Match the canvas and UI coordinate systems used by Colonist. */
      #game-canvas {
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 100%;
        height: 100%;
        background: #2b80bd;
        background-image: repeating-linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.05) 0 10px,
          transparent 10px 20px
        );
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          12px/1 ui-monospace,
          monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.6);
      }
      #ui-game {
        position: absolute;
        left: 0;
        pointer-events: none;
      }
      .preview-chat {
        position: absolute;
        right: 8px;
        top: 8px;
        bottom: 8px;
        width: 200px;
        padding: 12px;
        background: #eee5d4;
        color: #333;
        font: 13px/1.5 sans-serif;
        border: 2px solid #fff;
      }
    </style>
  </head>
  <body>
    <div id="game-canvas">colonist.io page</div>
    <div id="ui-game">
      <div class="preview-chat">
        Game chat preview<br />Aligned with the board
      </div>
    </div>
    <script src="dev-preview.js"></script>
  </body>
</html>
