<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Catan Counter</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        width: 260px;
        padding: 14px;
        background: #0f2c46;
        color: #dbe6ee;
        font:
          13px/1.4 system-ui,
          -apple-system,
          sans-serif;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
        font-weight: 800;
        color: #fff;
      }
      p.sub {
        margin: 0 0 14px;
        font-size: 11px;
        color: #7fa8c9;
      }
      fieldset {
        border: 0;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      label {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        padding: 9px 10px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.05);
        cursor: pointer;
      }
      label:hover {
        border-color: #7fa8c9;
      }
      label.selected {
        border-color: #f4c542;
        background: rgba(244, 197, 66, 0.1);
      }
      input {
        margin: 2px 0 0;
        accent-color: #f4c542;
      }
      .name {
        font-weight: 700;
        color: #fff;
      }
      .desc {
        font-size: 11px;
        color: #9fb8cc;
      }
      #status {
        margin: 12px 0 0;
        font-size: 11px;
        color: #7fa8c9;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Catan Counter</h1>
    <p class="sub">Choose how the counter is displayed.</p>
    <fieldset id="modes">
      <label data-mode="v1">
        <input type="radio" name="ui-mode" value="v1" />
        <span>
          <span class="name">Overlay</span><br />
          <span class="desc">Floating panel on top of the game.</span>
        </span>
      </label>
      <label data-mode="v2">
        <input type="radio" name="ui-mode" value="v2" />
        <span>
          <span class="name">Gutters</span><br />
          <span class="desc">Shrinks the game and fills the edges.</span>
        </span>
      </label>
    </fieldset>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
