<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Catan Counter</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        width: 260px;
        padding: 14px;
        background: #16181c;
        color: #eef1f4;
        font:
          13px/1.4 system-ui,
          -apple-system,
          sans-serif;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
        font-weight: 800;
        color: #fff;
      }
      p.sub {
        margin: 0 0 14px;
        font-size: 11px;
        color: #8a939d;
      }
      fieldset {
        border: 0;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      label {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        padding: 9px 10px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.05);
        cursor: pointer;
      }
      label:hover {
        border-color: #8a939d;
      }
      label.selected {
        border-color: #e8a33d;
        background: rgba(232, 163, 61, 0.1);
      }
      input {
        margin: 2px 0 0;
        accent-color: #e8a33d;
      }
      .name {
        font-weight: 700;
        color: #fff;
      }
      .desc {
        font-size: 11px;
        color: #c3ccd4;
      }
      .section {
        margin: 16px 0 0;
        padding: 13px 0 0;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
      h2 {
        margin: 0 0 2px;
        font-size: 12px;
        font-weight: 800;
        color: #fff;
      }
      #replay-count {
        margin: 0 0 9px;
        font-size: 11px;
        color: #8a939d;
      }
      .buttons {
        display: flex;
        gap: 7px;
      }
      button {
        flex: 1;
        padding: 8px 6px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.06);
        color: #eef1f4;
        font: inherit;
        font-weight: 700;
        font-size: 11px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: #8a939d;
      }
      button.primary {
        border-color: #e8a33d;
        background: rgba(232, 163, 61, 0.16);
        color: #f4c887;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #status {
        margin: 12px 0 0;
        font-size: 11px;
        color: #8a939d;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Catan Counter</h1>
    <p class="sub">Choose how the counter is displayed.</p>
    <fieldset id="modes">
      <label data-mode="v2">
        <input type="radio" name="ui-mode" value="v2" />
        <span>
          <span class="name">Gutters</span><br />
          <span class="desc">Shrinks the game and fills the edges.</span>
        </span>
      </label>
      <label data-mode="v1">
        <input type="radio" name="ui-mode" value="v1" />
        <span>
          <span class="name">Overlay</span><br />
          <span class="desc">Floating panel on top of the game.</span>
        </span>
      </label>
    </fieldset>
    <div class="section">
      <h2>Replays</h2>
      <p id="replay-count">Checking…</p>
      <div class="buttons">
        <button id="export-replays" class="primary" disabled>Export all</button>
        <button id="clear-replays" disabled>Clear</button>
      </div>
    </div>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
